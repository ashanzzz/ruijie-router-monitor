name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Run tests
        run: pytest -q
      - name: Check frontend syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('frontend/index.html').read_text(encoding='utf-8')
          start = source.index('<script>') + len('<script>')
          end = source.rindex('</script>')
          Path('/tmp/frontend_check.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/frontend_check.js

  docker:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --tag ghcr.io/ashanzzz/ruijie-router-monitor:latest \
            --tag ghcr.io/ashanzzz/ruijie-router-monitor:${{ github.sha }} \
            .
      - name: Push image
        run: |
          docker push ghcr.io/ashanzzz/ruijie-router-monitor:latest
          docker push ghcr.io/ashanzzz/ruijie-router-monitor:${{ github.sha }}
