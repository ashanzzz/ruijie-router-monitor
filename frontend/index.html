<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>锐捷网络监控</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--panel:#0d1929;--panel2:#111f31;--line:#203047;--text:#edf4ff;--muted:#8fa2bb;--accent:#4dd4ac;--blue:#62a7ff;--warn:#ffca68;--bad:#ff7d8f;--shadow:0 18px 60px rgba(0,0,0,.28)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#132844 0,transparent 34%),var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
    .auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(440px,100%);padding:30px;border:1px solid var(--line);border-radius:24px;background:rgba(13,25,41,.94);box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--blue));color:#06111c;font-size:21px;font-weight:900}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .field{display:grid;gap:7px;margin-top:16px}.field label{font-size:12px;color:#adc0d7}.input{width:100%;border:1px solid var(--line);background:#07121f;color:var(--text);border-radius:12px;padding:11px 12px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(98,167,255,.12)}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:#132237;color:var(--text);font-weight:700}.btn:hover{border-color:#405570}.btn.primary{background:linear-gradient(135deg,#2fc69c,#4b91ff);color:#06111b;border:0}.btn.danger{color:#ffd9df;border-color:#63313b;background:#2a151c}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.55;cursor:not-allowed}.error{margin-top:14px;color:#ffc0c9;background:#351720;border:1px solid #6b2a38;padding:10px 12px;border-radius:10px}
    .app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid rgba(45,65,91,.75);background:rgba(7,16,29,.86);backdrop-filter:blur(16px)}.top-actions{display:flex;gap:8px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 71px)}.sidebar{padding:20px 14px;border-right:1px solid var(--line)}.nav{display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#9db0c8;text-align:left}.nav button.active,.nav button:hover{background:#13243a;color:#fff}.main{padding:24px;min-width:0}.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.page-head h2{margin:0;font-size:24px}.page-head p{margin:4px 0 0;color:var(--muted)}
    .status-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,31,49,.94),rgba(10,21,35,.94));border-radius:16px;box-shadow:0 10px 36px rgba(0,0,0,.12)}.metric{padding:16px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:24px;margin-top:5px}.metric small{color:#9eb1c9}.panel{padding:17px;margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.panel-head h3{margin:0;font-size:15px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#0c192a;color:#aebed2;border-radius:999px;padding:6px 10px}.chip.active{border-color:#4d87bd;color:white;background:#17304a}
    .health{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--accent);box-shadow:0 0 0 4px rgba(77,212,172,.1)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
    .table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th{padding:9px 10px;border-bottom:1px solid var(--line);color:#7f94ad;font-size:11px;text-align:left;text-transform:uppercase;letter-spacing:.05em}.table td{padding:12px 10px;border-bottom:1px solid rgba(32,48,71,.7)}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:rgba(98,167,255,.05)}.device-title{font-weight:750}.sub{font-size:11px;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:999px;font-size:11px;background:#17283d;color:#b9c8d9}.badge.ok{color:#a8f4d9;background:#10372d}.badge.off{color:#a3afbf;background:#1b2430}.star{border:0;background:transparent;color:#66788f;font-size:18px;padding:2px 6px}.star.on{color:#ffd266}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.node-card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#0d1a2b;cursor:pointer}.node-card:hover{border-color:#3b5877}.node-card h4{margin:0;font-size:15px}.node-card .row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}.empty{padding:42px 20px;text-align:center;color:var(--muted)}
    .drawer-backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.48)}.drawer{position:fixed;right:0;top:0;z-index:41;width:min(720px,100%);height:100vh;background:#081421;border-left:1px solid var(--line);box-shadow:-22px 0 70px rgba(0,0,0,.4);overflow:auto;padding:22px}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:-22px;padding:20px 0 14px;background:#081421;z-index:2}.drawer-head h2{margin:0}.drawer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0d1b2d}.info span{display:block;font-size:11px;color:var(--muted)}.info strong{display:block;margin-top:4px;word-break:break-word}.tabs{display:flex;gap:6px;margin:18px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 9px;border-radius:8px}.tabs button.active{background:#17304a;color:#fff}.timeline{display:grid;gap:9px}.timeline-item{border-left:2px solid #315479;padding:7px 0 7px 12px}.timeline-item strong{display:block}.timeline-item span{color:var(--muted);font-size:12px}
    .modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:20px;background:#0b1727;box-shadow:var(--shadow);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.section-title{margin:24px 0 0;font-size:13px;color:#b8c8da;border-bottom:1px solid var(--line);padding-bottom:7px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.notice{padding:10px 12px;border-radius:11px;border:1px solid #5b4824;background:#2d2514;color:#ffe09b;margin:12px 0}.event-list{display:grid;gap:9px}.event{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0d1a2a}.event-head{display:flex;justify-content:space-between;gap:10px}.event p{margin:5px 0 0;color:#b7c5d5}.toast{position:fixed;right:20px;bottom:20px;z-index:80;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:#12243a;box-shadow:var(--shadow);max-width:420px}.toast.bad{background:#321720;border-color:#6c2b39}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:71px;z-index:18;padding:8px 12px;background:#091525;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.nav{display:flex;min-width:max-content}.nav button{width:auto}.status-strip{grid-template-columns:1fr 1fr}.main{padding:16px}.topbar{padding:13px 16px}}
    @media(max-width:560px){.status-strip{grid-template-columns:1fr}.form-grid,.drawer-grid{grid-template-columns:1fr}.brand p{display:none}.top-actions .label{display:none}}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="overlay"></div>
  <div id="toast" class="toast hidden"></div>
<script>
const state={
  csrf:null,clients:[],nodes:[],collector:{},database:normalizeDatabaseState(null),
  routerHost:'',events:[],page:'overview',clientFilter:'all',nodeFilter:'all',
  selectedClient:null,selectedTab:'overview',ws:null,
  settingsValidation:null,
};
const root=document.getElementById('root');
const overlay=document.getElementById('overlay');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmtTime=v=>v?new Date(v).toLocaleString():'—';
const fmtRate=v=>{v=Number(v||0);return v>=1024?(v/1024).toFixed(1)+' MB/s':v.toFixed(1)+' KB/s'};
const fmtBytes=v=>{v=Number(v||0);if(v>=1073741824)return(v/1073741824).toFixed(2)+' GB';if(v>=1048576)return(v/1048576).toFixed(1)+' MB';if(v>=1024)return(v/1024).toFixed(1)+' KB';return v+' B'};
const fmtRssi=v=>Number.isFinite(Number(v))?`${Number(v)} dBm`:'—';

function normalizeDbTarget(value){
  if(!value||typeof value!=='object')return null;
  if(value.type==='sqlite')return {type:'sqlite',filename:value.filename||'monitor.db',password_configured:false};
  if(value.type==='postgresql')return {
    type:'postgresql',host:value.host||'',port:Number(value.port||5432),
    database:value.database||value.name||'',user:value.user||value.username||'',
    sslmode:value.sslmode||'disable',password_configured:Boolean(value.password_configured)
  };
  return null;
}
function normalizeDatabaseState(value){
  const raw=value&&typeof value==='object'?value:{};
  const active=normalizeDbTarget(raw.active||raw.active_database);
  const configured=normalizeDbTarget(raw.configured||raw.configured_database)||active||{type:'sqlite',filename:'monitor.db'};
  return {
    ...raw,state:raw.state||'not_initialized',active,configured,
    restart_required:Boolean(raw.restart_required),
    last_successful_write_at:raw.last_successful_write_at||null,
    last_write_snapshot_id:raw.last_write_snapshot_id||null,
    last_error:raw.last_error||null,
  };
}
function normalizeConfig(raw){
  const value=raw&&typeof raw==='object'?raw:{};
  const runtime=normalizeDatabaseState(value.database_runtime||state.database);
  const database=normalizeDbTarget(value.database)||runtime.configured||{type:'sqlite',filename:'monitor.db'};
  database.password_configured=Boolean(value.database?.password_configured||database.password_configured);
  return {
    router_host:value.router_host||state.routerHost||'http://192.168.8.1',
    router_user:value.router_user??'',
    router_password_configured:Boolean(value.router_password_configured),
    poll_interval:Number(value.poll_interval||10),
    telegram_enabled:Boolean(value.telegram_enabled),
    telegram_token_configured:Boolean(value.telegram_token_configured),
    telegram_chat_id:value.telegram_chat_id||'',
    retention_days_normal:Number(value.retention_days_normal||30),
    retention_days_starred:Number(value.retention_days_starred||180),
    database,runtime,
  };
}
function toast(message,bad=false){const el=document.getElementById('toast');el.textContent=message;el.className='toast'+(bad?' bad':'');setTimeout(()=>el.classList.add('hidden'),4200)}
async function api(path,options={}){
  const method=(options.method||'GET').toUpperCase();
  const headers=new Headers(options.headers||{});
  if(options.body&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');
  if(!['GET','HEAD'].includes(method)&&state.csrf)headers.set('X-CSRF-Token',state.csrf);
  const res=await fetch(path,{...options,headers,credentials:'same-origin'});
  const data=await res.json().catch(()=>({}));
  if(res.status===401){await start();throw new Error('登录已失效')}
  if(!res.ok)throw new Error(typeof data.detail==='string'?data.detail:(data.detail?.message||data.message||`请求失败 ${res.status}`));
  return data;
}
function authView(mode,message=''){
  const setup=mode==='setup';
  const resetHelp=setup?'':`<div class="notice" style="margin-top:18px"><strong>忘记管理员密码？</strong><div class="sub" style="margin-top:5px">在Unraid/Docker终端复制执行以下命令，然后按提示输入并确认新的强密码：</div><code style="display:block;user-select:all;white-space:pre-wrap;margin-top:8px">docker exec -it ruijie-router-monitor python -m backend.cli auth reset-password</code><div class="sub" style="margin-top:6px">密码不会写入网页、命令行参数或Shell历史。</div></div>`;
  root.innerHTML=`<main class="auth-shell"><section class="auth-card"><div class="brand"><div class="brand-mark">R</div><div><h1>锐捷网络监控</h1><p>本地设备、AP与连接历史</p></div></div><p class="muted" style="margin:24px 0 0">${setup?'首次使用，请先设置本系统管理员密码。它不是锐捷路由器密码。':'输入管理员密码进入监控面板。'}</p><form id="auth-form"><div class="field"><label>${setup?'新管理员密码':'管理员密码'}</label><input class="input" id="auth-pass" type="password" autocomplete="${setup?'new-password':'current-password'}" required minlength="10"></div>${setup?'<div class="field"><label>确认管理员密码</label><input class="input" id="auth-confirm" type="password" autocomplete="new-password" required minlength="10"></div>':''}${message?`<div class="error">${esc(message)}</div>`:''}<button class="btn primary" style="width:100%;margin-top:20px" type="submit">${setup?'设置并进入':'登录'}</button></form>${resetHelp}</section></main>`;
  document.getElementById('auth-form').onsubmit=async e=>{
    e.preventDefault();const button=e.submitter;button.disabled=true;
    try{
      const payload=setup?{password:document.getElementById('auth-pass').value,confirm_password:document.getElementById('auth-confirm').value}:{password:document.getElementById('auth-pass').value};
      const data=await api(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',body:JSON.stringify(payload)});
      state.csrf=data.csrf_token;renderShell();await bootstrap();
    }catch(err){authView(mode,err.message)}finally{button.disabled=false}
  };
}
async function start(){
  try{
    const res=await fetch('/api/auth/status',{credentials:'same-origin'});
    const auth=await res.json();
    if(auth.setup_required)return authView('setup');
    if(!auth.authenticated)return authView('login');
    state.csrf=auth.csrf_token;renderShell();await bootstrap();
  }catch(err){authView('login','无法连接后台：'+err.message)}
}
function renderShell(){
  root.innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brand-mark">R</div><div><h1>锐捷网络监控</h1><p id="header-status">正在读取状态</p></div></div><div class="top-actions"><button class="btn" data-action="restart">🔄 <span class="label">重启服务</span></button><button class="btn" data-action="settings">⚙ <span class="label">设置</span></button><button class="btn" data-action="logout">退出</button></div></header><div class="layout"><aside class="sidebar"><nav class="nav">${[['overview','概览'],['clients','客户端'],['nodes','网络设备'],['favorites','关注列表'],['events','事件']].map(([id,label])=>`<button data-page="${id}">${label}</button>`).join('')}</nav></aside><main class="main" id="main"></main></div></div>`;
  root.onclick=handleRootClick;renderPage();
}
async function bootstrap(){
  try{
    const data=await api('/api/bootstrap');
    state.clients=Array.isArray(data.clients)?data.clients:[];
    state.nodes=Array.isArray(data.network_nodes)?data.network_nodes:[];
    state.collector=data.collector&&typeof data.collector==='object'?data.collector:{};
    state.database=normalizeDatabaseState(data.database);
    state.routerHost=data.router_host||state.routerHost||'';
    updateHeader();renderPage();connectWs();loadEvents();
  }catch(err){toast(err.message,true);renderPageError(err.message)}
}
function updateHeader(){const el=document.getElementById('header-status');if(!el)return;el.textContent=`采集：${state.collector.state||'未知'} · 客户端 ${state.clients.length} · 网络设备 ${state.nodes.length}`}
function handleRootClick(e){
  const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;renderPage();return}
  const action=e.target.closest('[data-action]');if(!action)return;
  const name=action.dataset.action;
  if(name==='settings')openSettings();
  else if(name==='restart')confirmRestart();
  else if(name==='logout')logout();
  else if(name==='refresh')bootstrap();
  else if(name==='client-filter'){state.clientFilter=action.dataset.value;renderClients()}
  else if(name==='node-filter'){state.nodeFilter=action.dataset.value;renderNodes()}
  else if(name==='star-client'){e.stopPropagation();setClientStar(action.dataset.mac,action.dataset.value!=='true')}
  else if(name==='star-node'){e.stopPropagation();setNodeStar(action.dataset.id,action.dataset.value!=='true')}
  else if(name==='client-row')openClient(action.dataset.mac);
  else if(name==='node-card')openNode(action.dataset.id);
}
function confirmRestart(){if(confirm('确定重启后台服务吗？页面会等待服务恢复后自动刷新。'))performRestart()}
async function performRestart(){
  overlay.innerHTML=`<div class="modal-backdrop"><div class="auth-card" style="text-align:center"><h3>正在等待服务重新启动…</h3><p class="muted">连接恢复后页面会自动刷新。</p></div></div>`;
  try{
    await api('/api/system/restart',{method:'POST',body:'{}'});
  }catch(err){
    closeOverlay();toast(err.message||'无法触发服务重启',true);return;
  }
  const deadline=Date.now()+90000;
  const poll=async()=>{
    if(Date.now()>deadline){overlay.innerHTML=`<div class="modal-backdrop"><div class="auth-card"><div class="error">服务未在90秒内恢复，请到Docker/Unraid检查容器状态。</div><button class="btn" onclick="location.reload()">重新加载</button></div></div>`;return}
    try{const res=await fetch('/api/health/live',{cache:'no-store'});if(res.ok){location.reload();return}}catch(_err){}
    setTimeout(poll,1800);
  };
  setTimeout(poll,1800);
}
function navActive(){document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===state.page))}
function renderPage(){const main=document.getElementById('main');if(!main)return;navActive();({overview:renderOverview,clients:renderClients,nodes:renderNodes,favorites:renderFavorites,events:renderEvents}[state.page]||renderOverview)()}
function renderPageError(message){const main=document.getElementById('main');if(main)main.innerHTML=`<div class="panel empty"><h3>加载失败</h3><p>${esc(message)}</p><button class="btn" data-action="refresh">重试</button></div>`}
function collectorHealth(){const s=state.collector.state;return s==='ready'?['ok','采集正常']:s==='stale'||s==='connection_failed'?['bad','采集异常']:['warn',s==='not_configured'?'尚未配置路由器':'初始化/等待中']}
function databaseHealth(){return state.database.state==='ready'?['ok','数据库正常']:['bad','数据库不可用']}
function dbSummary(db){if(!db)return'未连接';if(db.type==='sqlite')return`SQLite · ${db.filename||'monitor.db'}`;if(db.type==='postgresql')return`PostgreSQL · ${db.host||'—'}:${db.port||5432}/${db.database||'—'}`;return'未知数据库'}
function renderOverview(){
  const main=document.getElementById('main');const online=state.clients.filter(x=>x.is_online).length;const starred=state.clients.filter(x=>x.is_starred).length;const aps=state.nodes.filter(x=>x.type==='ap').length;const[cc,ct]=collectorHealth();const[dc,dt]=databaseHealth();
  const active=state.database.active;const configured=state.database.configured;const routerOk=state.collector.state==='ready';const dbOk=state.database.state==='ready';

on class="panel"><div class="panel-head"><h3>关注客户端</h3><button class="btn small" data-page="favorites">查看全部</button></div>${clientCards(state.clients.filter(x=>x.is_starred).slice(0,6))}</section><section class="panel"><div class="panel-head"><h3>网络设备</h3><button class="btn small" data-page="nodes">查看全部</button></div>${nodeCards(state.nodes.slice(0,6))}</section>`;

  }catch(err){toast(err.message,true)}
}
async function testDiscover(e){e?.preventDefault();const el=document.getElementById('discover-result'),btn=document.getElementById('discover-btn');const validation=state.settingsValidation;validation.routerTestRevision=-1;checkSaveBtn();btn.disabled=true;el.className='notice';el.textContent='正在登录并发现user_list/local_topology…';try{const data=await api('/api/router/discover',{method:'POST',body:JSON.stringify(routerPayload())});const counts=data.counts||{};const capabilities=data.capabilities||{};el.textContent=`认证成功；客户端 ${Number(counts.clients||0)}；网络节点 ${Number(counts.network_nodes||0)}；接口直采 ${capabilities.direct_api?'可用':'等待首次学习'}`;validation.routerTestRevision=validation.revision}catch(err){validation.routerTestRevision=-1;el.className='error';el.textContent=err.message}finally{btn.disabled=false;checkSaveBtn()}}
async function testDb(e){e?.preventDefault();const el=document.getElementById('db-test-result'),btn=document.getElementById('db-test-btn');const validation=state.settingsValidation;validation.dbTestRevision=-1;checkSaveBtn();btn.disabled=true;el.className='notice';el.textContent='正在验证连接、临时表和读写权限…';try{const data=await api('/api/database/test',{method:'POST',body:JSON.stringify(dbPayload())});el.textContent=data.message||'数据库连接和读写验证成功';validation.dbTestRevision=validation.revision}catch(err){validation.dbTestRevision=-1;el.className='error';el.textContent=err.message}finally{btn.disabled=false;checkSaveBtn()}}
async function saveSettings(e){e.preventDefault();const btn=e.submitter;const v=state.settingsValidation;if(!v||v.routerTestRevision!==v.revision||v.dbTestRevision!==v.revision){toast('当前配置尚未通过两项测试',true);checkSaveBtn();return}btn.disabled=true;try{const payload={router_host:document.getElementById('s-router-host').value.trim(),router_user:document.getElementById('s-router-user').value.trim(),router_password:document.getElementById('s-router-pass').value||null,poll_interval:Number(document.getElementById('s-poll').value),telegram_enabled:document.getElementById('s-tg-enabled').value==='true',telegram_token:document.getElementById('s-tg-token').value||null,telegram_chat_id:document.getElementById('s-tg-chat').value.trim(),retention_days_normal:Number(document.getElementById('s-ret-normal').value),retention_days_starred:Number(document.getElementById('s-ret-starred').value),database:dbPayload()};const data=await api('/api/config',{method:'POST',body:JSON.stringify(payload)});closeOverlay();if(confirm('配置已保存。是否立即重启服务，让数据库与核心参数完整重新加载？'))performRestart();else{toast(data.restart_required?'配置已保存，数据库切换等待重启':'配置已保存');await bootstrap()}}catch(err){toast(err.message,true);btn.disabled=false}}
async function savePassword(e){e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const data=await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current_password:document.getElementById('p-current').value,new_password:document.getElementById('p-new').value,confirm_password:document.getElementById('p-confirm').value})});state.csrf=data.csrf_token;toast('管理员密码已修改，其他会话已失效');closeOverlay()}catch(err){toast(err.message,true)}finally{btn.disabled=false}}
start();
</script>
