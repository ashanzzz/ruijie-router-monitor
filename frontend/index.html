<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>锐捷网络监控</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--panel:#0d1929;--panel2:#111f31;--line:#203047;--text:#edf4ff;--muted:#8fa2bb;--accent:#4dd4ac;--blue:#62a7ff;--warn:#ffca68;--bad:#ff7d8f;--shadow:0 18px 60px rgba(0,0,0,.28)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#132844 0,transparent 34%),var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
    .auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(440px,100%);padding:30px;border:1px solid var(--line);border-radius:24px;background:rgba(13,25,41,.94);box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--blue));color:#06111c;font-size:21px;font-weight:900}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .field{display:grid;gap:7px;margin-top:16px}.field label{font-size:12px;color:#adc0d7}.input{width:100%;border:1px solid var(--line);background:#07121f;color:var(--text);border-radius:12px;padding:11px 12px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(98,167,255,.12)}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:#132237;color:var(--text);font-weight:700}.btn:hover{border-color:#405570}.btn.primary{background:linear-gradient(135deg,#2fc69c,#4b91ff);color:#06111b;border:0}.btn.danger{color:#ffd9df;border-color:#63313b;background:#2a151c}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.55;cursor:not-allowed}.error{margin-top:14px;color:#ffc0c9;background:#351720;border:1px solid #6b2a38;padding:10px 12px;border-radius:10px}
    .app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid rgba(45,65,91,.75);background:rgba(7,16,29,.86);backdrop-filter:blur(16px)}.top-actions{display:flex;gap:8px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 71px)}.sidebar{padding:20px 14px;border-right:1px solid var(--line)}.nav{display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#9db0c8;text-align:left}.nav button.active,.nav button:hover{background:#13243a;color:#fff}.main{padding:24px;min-width:0}.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.page-head h2{margin:0;font-size:24px}.page-head p{margin:4px 0 0;color:var(--muted)}
    .status-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,31,49,.94),rgba(10,21,35,.94));border-radius:16px;box-shadow:0 10px 36px rgba(0,0,0,.12)}.metric{padding:16px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:24px;margin-top:5px}.metric small{color:#9eb1c9}.panel{padding:17px;margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.panel-head h3{margin:0;font-size:15px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#0c192a;color:#aebed2;border-radius:999px;padding:6px 10px}.chip.active{border-color:#4d87bd;color:white;background:#17304a}
    .health{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--accent);box-shadow:0 0 0 4px rgba(77,212,172,.1)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
    .table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th{padding:9px 10px;border-bottom:1px solid var(--line);color:#7f94ad;font-size:11px;text-align:left;text-transform:uppercase;letter-spacing:.05em}.table td{padding:12px 10px;border-bottom:1px solid rgba(32,48,71,.7)}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:rgba(98,167,255,.05)}.device-title{font-weight:750}.sub{font-size:11px;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:999px;font-size:11px;background:#17283d;color:#b9c8d9}.badge.ok{color:#a8f4d9;background:#10372d}.badge.off{color:#a3afbf;background:#1b2430}.star{border:0;background:transparent;color:#66788f;font-size:18px;padding:2px 6px}.star.on{color:#ffd266}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.node-card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#0d1a2b;cursor:pointer}.node-card:hover{border-color:#3b5877}.node-card h4{margin:0;font-size:15px}.node-card .row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}.empty{padding:42px 20px;text-align:center;color:var(--muted)}
    .drawer-backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.48)}.drawer{position:fixed;right:0;top:0;z-index:41;width:min(720px,100%);height:100vh;background:#081421;border-left:1px solid var(--line);box-shadow:-22px 0 70px rgba(0,0,0,.4);overflow:auto;padding:22px}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:-22px;padding:20px 0 14px;background:#081421;z-index:2}.drawer-head h2{margin:0}.drawer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0d1b2d}.info span{display:block;font-size:11px;color:var(--muted)}.info strong{display:block;margin-top:4px;word-break:break-word}.tabs{display:flex;gap:6px;margin:18px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 9px;border-radius:8px}.tabs button.active{background:#17304a;color:#fff}.timeline{display:grid;gap:9px}.timeline-item{border-left:2px solid #315479;padding:7px 0 7px 12px}.timeline-item strong{display:block}.timeline-item span{color:var(--muted);font-size:12px}
    .modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:20px;background:#0b1727;box-shadow:var(--shadow);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.section-title{margin:24px 0 0;font-size:13px;color:#b8c8da;border-bottom:1px solid var(--line);padding-bottom:7px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.notice{padding:10px 12px;border-radius:11px;border:1px solid #5b4824;background:#2d2514;color:#ffe09b;margin:12px 0}.event-list{display:grid;gap:9px}.event{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0d1a2a}.event-head{display:flex;justify-content:space-between;gap:10px}.event p{margin:5px 0 0;color:#b7c5d5}.toast{position:fixed;right:20px;bottom:20px;z-index:80;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:#12243a;box-shadow:var(--shadow);max-width:420px}.toast.bad{background:#321720;border-color:#6c2b39}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:71px;z-index:18;padding:8px 12px;background:#091525;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.nav{display:flex;min-width:max-content}.nav button{width:auto}.status-strip{grid-template-columns:1fr 1fr}.main{padding:16px}.topbar{padding:13px 16px}}
    @media(max-width:560px){.status-strip{grid-template-columns:1fr}.form-grid,.drawer-grid{grid-template-columns:1fr}.brand p{display:none}.top-actions .label{display:none}}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="overlay"></div>
  <div id="toast" class="toast hidden"></div>
<script>
const state={csrf:null,clients:[],nodes:[],collector:{},database:{},events:[],page:'overview',clientFilter:'all',nodeFilter:'all',selectedClient:null,selectedTab:'overview',ws:null};
const root=document.getElementById('root'),overlay=document.getElementById('overlay');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmtTime=v=>v?new Date(v).toLocaleString():'—';
const fmtRate=v=>{v=Number(v||0);return v>=1024?(v/1024).toFixed(1)+' MB/s':v.toFixed(1)+' KB/s'};
const fmtBytes=v=>{v=Number(v||0);if(v>=1073741824)return(v/1073741824).toFixed(2)+' GB';if(v>=1048576)return(v/1048576).toFixed(1)+' MB';if(v>=1024)return(v/1024).toFixed(1)+' KB';return v+' B'};
function toast(message,bad=false){const el=document.getElementById('toast');el.textContent=message;el.className='toast'+(bad?' bad':'');setTimeout(()=>el.classList.add('hidden'),4200)}
async function api(path,options={}){const method=(options.method||'GET').toUpperCase();const headers=new Headers(options.headers||{});if(options.body&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');if(!['GET','HEAD'].includes(method)&&state.csrf)headers.set('X-CSRF-Token',state.csrf);const res=await fetch(path,{...options,headers,credentials:'same-origin'});const data=await res.json().catch(()=>({}));if(res.status===401){await start();throw new Error('登录已失效')}if(!res.ok)throw new Error(typeof data.detail==='string'?data.detail:(data.detail?.message||data.message||`请求失败 ${res.status}`));return data}
function authView(mode,message=''){const setup=mode==='setup';root.innerHTML=`<main class="auth-shell"><section class="auth-card"><div class="brand"><div class="brand-mark">R</div><div><h1>锐捷网络监控</h1><p>本地设备、AP与连接历史</p></div></div><p class="muted" style="margin:24px 0 0">${setup?'首次使用，请先设置本系统管理员密码。它不是锐捷路由器密码。':'输入管理员密码进入监控面板。<br><span style="font-size:12px;color:#8ba3c7;display:inline-block;margin-top:8px;">忘记密码？可在终端运行重置命令：<br><code style="user-select:all;background:#121a24;padding:4px 8px;border-radius:4px;margin-top:4px;display:inline-block;border:1px solid #1d2838;color:#a3b8d7;">echo 新密码 | docker exec -i 容器名 python -m backend.cli auth reset-password --password-stdin</code></span>'}</p><form id="auth-form"><div class="field"><label>${setup?'新管理员密码':'管理员密码'}</label><input class="input" id="auth-pass" type="password" autocomplete="${setup?'new-password':'current-password'}" required minlength="10"></div>${setup?'<div class="field"><label>确认管理员密码</label><input class="input" id="auth-confirm" type="password" autocomplete="new-password" required minlength="10"></div>':''}${message?`<div class="error">${esc(message)}</div>`:''}<button class="btn primary" style="width:100%;margin-top:20px" type="submit">${setup?'设置并进入':'登录'}</button></form></section></main>`;document.getElementById('auth-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{const payload=setup?{password:document.getElementById('auth-pass').value,confirm_password:document.getElementById('auth-confirm').value}:{password:document.getElementById('auth-pass').value};const data=await api(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',body:JSON.stringify(payload)});state.csrf=data.csrf_token;renderShell();await bootstrap()}catch(err){authView(mode,err.message)}finally{button.disabled=false}}}
async function start(){try{const auth=await fetch('/api/auth/status',{credentials:'same-origin'}).then(r=>r.json());if(auth.setup_required)return authView('setup');if(!auth.authenticated)return authView('login');state.csrf=auth.csrf_token;renderShell();await bootstrap()}catch(err){authView('login','无法连接后台：'+err.message)}}
function renderShell(){root.innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brand-mark">R</div><div><h1>锐捷网络监控</h1><p id="header-status">正在读取状态</p></div></div><div class="top-actions"><button class="btn" data-action="restart">🔄 <span class="label">重启服务</span></button><button class="btn" data-action="settings">⚙ <span class="label">设置</span></button><button class="btn" data-action="logout">退出</button></div></header><div class="layout"><aside class="sidebar"><nav class="nav">${[['overview','概览'],['clients','客户端'],['nodes','网络设备'],['favorites','关注列表'],['events','事件']].map(([id,label])=>`<button data-page="${id}">${label}</button>`).join('')}</nav></aside><main class="main" id="main"></main></div></div>`;root.onclick=handleRootClick;renderPage()}
async function bootstrap(){try{const data=await api('/api/bootstrap');state.clients=data.clients||[];state.nodes=data.network_nodes||[];state.collector=data.collector||{};state.database=data.database||{};state.router_host=data.router_host||'';updateHeader();renderPage();connectWs();loadEvents()}catch(err){toast(err.message,true);renderPageError(err.message)}}
function updateHeader(){const el=document.getElementById('header-status');if(!el)return;const c=state.collector;el.textContent=`采集：${c.state||'未知'} · 客户端 ${state.clients.length} · 网络设备 ${state.nodes.length}`}
function handleRootClick(e){const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;renderPage();return}const action=e.target.closest('[data-action]');if(!action)return;const name=action.dataset.action;if(name==='settings')openSettings();if(name==='restart')confirmRestart();if(name==='logout')logout();if(name==='refresh')bootstrap();if(name==='client-filter'){state.clientFilter=action.dataset.value;renderClients()}if(name==='node-filter'){state.nodeFilter=action.dataset.value;renderNodes()}if(name==='star-client'){e.stopPropagation();setClientStar(action.dataset.mac,action.dataset.value!=='true')}if(name==='star-node'){e.stopPropagation();setNodeStar(action.dataset.id,action.dataset.value!=='true')}if(name==='client-row')openClient(action.dataset.mac);if(name==='node-card')openNode(action.dataset.id)}
function confirmRestart(){if(!confirm('确定要完整重启后台服务吗？这将断开当前所有连接并重新加载所有组件。'))return;performRestart()}
async function performRestart(){overlay.innerHTML=`<div class="modal-backdrop"><div style="background:#1d2838;padding:32px;border-radius:12px;border:1px solid #2e405a;text-align:center;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,0.5);"><h3>🚀 正在重启服务...</h3><p class="muted" style="margin-top:12px">请稍候，系统正在重新启动并加载组件，页面将自动刷新。</p></div></div>`;try{await api('/api/system/restart',{method:'POST'})}catch(err){}const ping=async()=>{try{const res=await fetch('/api/bootstrap');if(res.ok){location.reload();return}}catch(e){}setTimeout(ping,2000)};setTimeout(ping,3000)}
function navActive(){document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===state.page))}
function renderPage(){const main=document.getElementById('main');if(!main)return;navActive();if(state.page==='overview')renderOverview();if(state.page==='clients')renderClients();if(state.page==='nodes')renderNodes();if(state.page==='favorites')renderFavorites();if(state.page==='events')renderEvents()}
function renderPageError(message){const main=document.getElementById('main');if(main)main.innerHTML=`<div class="panel empty"><h3>加载失败</h3><p>${esc(message)}</p><button class="btn" data-action="refresh">重试</button></div>`}
function collectorHealth(){const s=state.collector.state;return s==='ready'?['ok','采集正常']:['warn',s==='not_configured'?'尚未配置路由器':'采集异常/等待中']}
function databaseHealth(){return state.database.state==='ready'?['ok','数据库正常']:['bad','数据库不可用']}
function renderOverview(){const main=document.getElementById('main'),online=state.clients.filter(x=>x.is_online).length,starred=state.clients.filter(x=>x.is_starred).length,aps=state.nodes.filter(x=>x.type==='ap').length,[cc,ct]=collectorHealth(),[dc,dt]=databaseHealth();
const db=state.database, c=state.collector;
const dbType = db.active?.type === 'sqlite' ? '本地 SQLite' : 'PostgreSQL';
const dbSummaryText = db.active?.type === 'sqlite' ? db.active.filename : db.active?.host + ':' + db.active?.port;
const routerStatus = c.state === 'ready' ? '已连接' : (c.state === 'error' ? '连接失败' : '初始化中');
const dbStatus = db.state === 'ready' ? '已连接' : (db.state === 'error' ? '连接异常' : '未就绪');
const routerColor = c.state==='ready'?'#10b981':(c.state==='error'?'#ef4444':'#f59e0b');
const dbColor = db.state==='ready'?'#10b981':'#ef4444';
main.innerHTML=`<div class="page-head"><div><h2>网络概览</h2><p>当前状态与最近采集结果</p></div><button class="btn" data-action="refresh">刷新</button></div><div class="panel" style="margin-bottom:24px;background:#1d2838;padding:16px 20px;border-radius:12px;border:1px solid #2e405a;display:flex;flex-wrap:wrap;gap:24px;font-size:14px;color:#a3b8d7;align-items:center;"><div>当前路由器 IP：<strong style="color:#fff">${esc(state.router_host)}</strong> <span style="margin-left:8px;padding:2px 8px;border-radius:4px;background:${routerColor}20;color:${routerColor};font-size:12px;border:1px solid ${routerColor}40;">${routerStatus}</span></div><div>当前数据库类型：<strong style="color:#fff">${dbType}</strong></div><div>数据库地址：<strong style="color:#fff">${esc(dbSummaryText)}</strong> <span style="margin-left:8px;padding:2px 8px;border-radius:4px;background:${dbColor}20;color:${dbColor};font-size:12px;border:1px solid ${dbColor}40;">${dbStatus}</span></div></div><section class="status-strip"><div class="metric"><span>在线客户端</span><strong>${online}</strong><small>历史设备 ${state.clients.length}</small></div><div class="metric"><span>AP节点</span><strong>${aps}</strong><small>网络节点 ${state.nodes.length}</small></div><div class="metric"><span>已关注客户端</span><strong>${starred}</strong><small>便于快速查看</small></div><div class="metric"><span>实时总下行</span><strong>${fmtRate(state.clients.filter(x=>x.is_online).reduce((a,b)=>a+Number(b.rx_rate||0),0))}</strong><small>实时采集值</small></div></section><section class="panel"><div class="panel-head"><h3>运行状态</h3></div><div class="drawer-grid"><div class="info"><span>锐捷采集</span><strong class="health"><i class="dot ${cc}"></i>${esc(ct)}</strong><div class="sub">${esc(state.collector.last_error?.message||'最后采集：'+fmtTime(state.collector.last_snapshot_at))}</div></div><div class="info"><span>业务数据库</span><strong class="health"><i class="dot ${dc}"></i>${esc(dt)}</strong><div class="sub">${esc(dbSummary(state.database.active))}</div></div><div class="info"><span>采集方式</span><strong>${esc(state.collector.collection_source||'—')}</strong><div class="sub">${esc(state.collector.profile_id||'尚未识别固件')}</div></div><div class="info"><span>最后成功写入</span><strong>${fmtTime(state.database.last_successful_write_at)}</strong><div class="sub">${esc(state.database.last_write_snapshot_id||'尚无快照')}</div></div></div>${state.database.restart_required?'<div class="notice">已保存的新数据库配置与当前活动数据库不同，需要重启容器后生效。</div>':''}</section><section class="panel"><div class="panel-head"><h3>关注客户端</h3><button class="btn small" data-page="favorites">查看全部</button></div>${clientCards(state.clients.filter(x=>x.is_starred).slice(0,6))}</section><section class="panel"><div class="panel-head"><h3>网络设备</h3><button class="btn small" data-page="nodes">查看全部</button></div>${nodeCards(state.nodes.slice(0,6))}</section>`}
function dbSummary(db){if(!db)return'未连接';return db.type==='sqlite'?`SQLite · ${db.filename}`:`PostgreSQL · ${db.host}:${db.port}/${db.database}`}
function clientCards(items){if(!items.length)return'<div class="empty">尚无关注客户端</div>';return `<div class="cards">${items.map(x=>`<article class="node-card" data-action="client-row" data-mac="${esc(x.mac)}"><div style="display:flex;justify-content:space-between"><h4>${esc(x.display_name)}</h4><button class="star ${x.is_starred?'on':''}" data-action="star-client" data-mac="${esc(x.mac)}" data-value="${x.is_starred}">★</button></div><div class="row"><span>${x.is_online?'在线':'离线'} · ${esc(x.ip||'无IP')}</span><span>${esc(x.parent_name||'上级未知')}</span></div><div class="row"><span>↓ ${fmtRate(x.rx_rate)}</span><span>↑ ${fmtRate(x.tx_rate)}</span></div></article>`).join('')}</div>`}
function nodeCards(items){if(!items.length)return'<div class="empty">尚未取得local_topology拓扑数据</div>';return `<div class="cards">${items.map(x=>`<article class="node-card" data-action="node-card" data-id="${esc(x.node_id)}"><div style="display:flex;justify-content:space-between"><h4>${esc(x.display_name)}</h4><button class="star ${x.is_starred?'on':''}" data-action="star-node" data-id="${esc(x.node_id)}" data-value="${x.is_starred}">★</button></div><div class="row"><span>${esc(typeLabel(x.type))} · ${x.is_online?'在线':'离线'}</span><span>${x.online_client_count} 客户端</span></div><div class="row"><span>${esc(x.model||'型号未知')}</span><span>${esc(x.management_ip||'无管理IP')}</span></div></article>`).join('')}</div>`}
function typeLabel(t){return({gateway:'网关',ap:'AP',switch:'交换机',unknown:'未知节点'})[t]||t}
function renderClients(){const main=document.getElementById('main');let items=state.clients;if(state.clientFilter==='online')items=items.filter(x=>x.is_online);if(state.clientFilter==='offline')items=items.filter(x=>!x.is_online);if(state.clientFilter==='starred')items=items.filter(x=>x.is_starred);main.innerHTML=`<div class="page-head"><div><h2>客户端</h2><p>当前状态、上级设备和关注标记</p></div><button class="btn" data-action="refresh">刷新</button></div><section class="panel"><div class="panel-head"><div class="chips">${[['all','全部'],['online','在线'],['offline','离线'],['starred','已关注']].map(([id,label])=>`<button class="chip ${state.clientFilter===id?'active':''}" data-action="client-filter" data-value="${id}">${label}</button>`).join('')}</div><span class="muted">${items.length} 台</span></div>${items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>客户端</th><th>状态</th><th>IP/SSID</th><th>上级设备</th><th>实时速率</th><th>最后出现</th><th></th></tr></thead><tbody>${items.map(x=>`<tr data-action="client-row" data-mac="${esc(x.mac)}"><td><div class="device-title">${esc(x.display_name)}</div><div class="sub">${esc(x.mac)}</div></td><td><span class="badge ${x.is_online?'ok':'off'}">${x.is_online?'在线':'离线'}</span><div class="sub">${esc(x.usage_state||'')}</div></td><td>${esc(x.ip||'—')}<div class="sub">${esc(x.ssid||'—')} ${x.rssi?` <span style="color:#a3b8d7">(信号: ${esc(x.rssi)})</span>`:''}</div></td><td>${esc(x.parent_name||'未知')}<div class="sub">${esc(x.ap_sn||'')}</div></td><td>↓ ${fmtRate(x.rx_rate)}<div class="sub">↑ ${fmtRate(x.tx_rate)}</div></td><td>${fmtTime(x.last_seen)}</td><td><button class="star ${x.is_starred?'on':''}" data-action="star-client" data-mac="${esc(x.mac)}" data-value="${x.is_starred}">★</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">当前筛选没有客户端</div>'}</section>`}
function renderNodes(){const main=document.getElementById('main');let items=state.nodes;if(state.nodeFilter!=='all')items=items.filter(x=>state.nodeFilter==='starred'?x.is_starred:x.type===state.nodeFilter);main.innerHTML=`<div class="page-head"><div><h2>网络设备</h2><p>网关、AP、交换机和上下级关系</p></div><button class="btn" data-action="refresh">刷新</button></div><section class="panel"><div class="panel-head"><div class="chips">${[['all','全部'],['gateway','网关'],['ap','AP'],['switch','交换机'],['starred','已关注']].map(([id,label])=>`<button class="chip ${state.nodeFilter===id?'active':''}" data-action="node-filter" data-value="${id}">${label}</button>`).join('')}</div><span class="muted">${items.length} 个</span></div>${nodeCards(items)}</section>`}
function renderFavorites(){const main=document.getElementById('main');main.innerHTML=`<div class="page-head"><div><h2>关注列表</h2><p>客户端与网络设备分组显示</p></div></div><section class="panel"><div class="panel-head"><h3>关注客户端</h3><span class="muted">${state.clients.filter(x=>x.is_starred).length}</span></div>${clientCards(state.clients.filter(x=>x.is_starred))}</section><section class="panel"><div class="panel-head"><h3>关注网络设备</h3><span class="muted">${state.nodes.filter(x=>x.is_starred).length}</span></div>${nodeCards(state.nodes.filter(x=>x.is_starred))}</section>`}
async function loadEvents(){try{state.events=(await api('/api/events?limit=100')).events||[];if(state.page==='events')renderEvents()}catch(err){console.error(err)}}
function renderEvents(){const main=document.getElementById('main');main.innerHTML=`<div class="page-head"><div><h2>事件</h2><p>上线、下线和位置变化</p></div><button class="btn" onclick="loadEvents()">刷新</button></div><section class="panel">${eventList(state.events)}</section>`}
function eventList(items){if(!items.length)return'<div class="empty">尚无事件记录</div>';return `<div class="event-list">${items.map(x=>`<article class="event"><div class="event-head"><strong>${esc(x.event_type)} · ${esc(x.device_name||x.mac||'系统')}</strong><span class="sub">${fmtTime(x.created_at)}</span></div><p>${esc(x.message)}</p></article>`).join('')}</div>`}
async function setClientStar(mac,value){try{await api(`/api/clients/${encodeURIComponent(mac)}/star`,{method:'POST',body:JSON.stringify({is_starred:value})});const item=state.clients.find(x=>x.mac===mac);if(item)item.is_starred=value;renderPage()}catch(err){toast(err.message,true)}}
async function setNodeStar(id,value){try{await api(`/api/network-nodes/${encodeURIComponent(id)}/star`,{method:'POST',body:JSON.stringify({is_starred:value})});const item=state.nodes.find(x=>x.node_id===id);if(item)item.is_starred=value;renderPage()}catch(err){toast(err.message,true)}}
async function openClient(mac){state.selectedClient=mac;state.selectedTab='overview';overlay.innerHTML=`<div class="drawer-backdrop" data-close></div><aside class="drawer"><div class="drawer-head"><div><h2>客户端详情</h2><p class="muted">正在加载 ${esc(mac)}</p></div><button class="btn" data-close>关闭</button></div><div class="empty">加载中…</div></aside>`;overlay.onclick=e=>{if(e.target.closest('[data-close]'))closeOverlay()};try{const [detail,sessions,locations,traffic,events]=await Promise.all([api(`/api/clients/${encodeURIComponent(mac)}`),api(`/api/clients/${encodeURIComponent(mac)}/sessions`),api(`/api/clients/${encodeURIComponent(mac)}/locations`),api(`/api/clients/${encodeURIComponent(mac)}/traffic?range=24h`),api(`/api/clients/${encodeURIComponent(mac)}/events`)]);renderClientDrawer(detail.client,sessions.sessions,locations.locations,traffic.samples,events.events)}catch(err){overlay.querySelector('.drawer').innerHTML=`<div class="error">${esc(err.message)}</div>`}}
function renderClientDrawer(c,sessions,locations,traffic,events){const current=c.current_session;overlay.innerHTML=`<div class="drawer-backdrop" data-close></div><aside class="drawer"><div class="drawer-head"><div><h2>${esc(c.display_name)}</h2><p class="muted">${esc(c.mac)} · ${c.is_online?'在线':'离线'}</p></div><button class="btn" data-close>关闭</button></div><div class="drawer-grid"><div class="info"><span>IP / SSID</span><strong>${esc(c.ip||'—')} · ${esc(c.ssid||'—')} ${c.rssi?`<small style="color:#a3b8d7;font-weight:normal">(信号: ${esc(c.rssi)})</small>`:''}</strong></div><div class="info"><span>当前上级</span><strong>${esc(c.parent_name||'未知')}</strong></div><div class="info"><span>实时速率</span><strong>↓ ${fmtRate(c.rx_rate)} · ↑ ${fmtRate(c.tx_rate)}</strong></div><div class="info"><span>本次会话流量</span><strong>↓ ${fmtBytes(current?.rx_bytes)} · ↑ ${fmtBytes(current?.tx_bytes)}</strong></div><div class="info"><span>最近上线</span><strong>${fmtTime(c.last_online_at)}</strong></div><div class="info"><span>最近下线</span><strong>${fmtTime(c.last_offline_at)}</strong></div></div><div class="tabs">${[['overview','会话'],['locations','位置'],['traffic','流量'],['events','事件']].map(([id,label])=>`<button data-detail-tab="${id}" class="${state.selectedTab===id?'active':''}">${label}</button>`).join('')}</div><div id="detail-content"></div></aside>`;overlay.onclick=e=>{if(e.target.closest('[data-close]'))return closeOverlay();const tab=e.target.closest('[data-detail-tab]');if(tab){state.selectedTab=tab.dataset.detailTab;renderDetailContent(sessions,locations,traffic,events);overlay.querySelectorAll('[data-detail-tab]').forEach(x=>x.classList.toggle('active',x.dataset.detailTab===state.selectedTab))}};renderDetailContent(sessions,locations,traffic,events)}
function renderDetailContent(sessions,locations,traffic,events){const el=document.getElementById('detail-content');if(!el)return;if(state.selectedTab==='overview')el.innerHTML=sessions.length?`<div class="timeline">${sessions.map(x=>`<div class="timeline-item"><strong>${fmtTime(x.session_start)} → ${x.session_end?fmtTime(x.session_end):'当前在线'}</strong><span>${esc(x.ap_name||'位置未知')} · ↓ ${fmtBytes(x.rx_bytes)} · ↑ ${fmtBytes(x.tx_bytes)}</span></div>`).join('')}</div>`:'<div class="empty">尚无会话历史</div>';if(state.selectedTab==='locations')el.innerHTML=locations.length?`<div class="timeline">${locations.map(x=>`<div class="timeline-item"><strong>${esc(x.parent_name||'未知上级')}</strong><span>${fmtTime(x.entered_at)} → ${x.left_at?fmtTime(x.left_at):'当前'}</span></div>`).join('')}</div>`:'<div class="empty">尚无位置轨迹</div>';if(state.selectedTab==='traffic')el.innerHTML=traffic.length?`<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>下行</th><th>上行</th></tr></thead><tbody>${traffic.map(x=>`<tr><td>${fmtTime(x.sampled_at)}</td><td>${fmtRate(x.rx_rate_kbps)}</td><td>${fmtRate(x.tx_rate_kbps)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">历史流量从启用新版采样后开始记录</div>';if(state.selectedTab==='events')el.innerHTML=eventList(events)}
async function openNode(id){try{const data=await api(`/api/network-nodes/${encodeURIComponent(id)}`),n=data.node;overlay.innerHTML=`<div class="drawer-backdrop" data-close></div><aside class="drawer"><div class="drawer-head"><div><h2>${esc(n.display_name)}</h2><p class="muted">${esc(typeLabel(n.type))} · ${n.is_online?'在线':'离线'}</p></div><button class="btn" data-close>关闭</button></div><div class="drawer-grid"><div class="info"><span>型号</span><strong>${esc(n.model||'未知')}</strong></div><div class="info"><span>管理IP</span><strong>${esc(n.management_ip||'—')}</strong></div><div class="info"><span>上级设备</span><strong>${esc(n.parent_name||'根节点')}</strong></div><div class="info"><span>当前客户端</span><strong>${n.online_client_count}</strong></div><div class="info full"><span>序列号 / ID</span><strong>${esc(n.serial_number||n.node_id)}</strong></div></div><section class="panel" style="margin-top:16px"><div class="panel-head"><h3>当前下级客户端</h3></div>${clientCards(n.clients||[])}</section></aside>`;overlay.onclick=e=>{if(e.target.closest('[data-close]'))closeOverlay();const row=e.target.closest('[data-action="client-row"]');if(row)openClient(row.dataset.mac)}}catch(err){toast(err.message,true)}}
function closeOverlay(){overlay.innerHTML=''}
async function logout(){try{await api('/api/auth/logout',{method:'POST',body:'{}'})}finally{state.csrf=null;if(state.ws)state.ws.close();start()}}
function connectWs(){if(state.ws&&state.ws.readyState<2)return;const protocol=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${protocol}://${location.host}/ws`);state.ws=ws;ws.onopen=()=>ws.send('ready');ws.onmessage=e=>{try{const data=JSON.parse(e.data);if(data.type==='SNAPSHOT_COMMITTED'){state.clients=data.clients||[];state.nodes=data.network_nodes||[];state.collector.last_snapshot_at=data.timestamp;state.collector.state='ready';updateHeader();renderPage()}}catch(err){console.error(err)}};ws.onclose=e=>{if(e.code!==4401)setTimeout(connectWs,4000)}}
async function openSettings(){try{const cfg=await api('/api/config'),db=cfg.database||{};overlay.innerHTML=`<div class="modal-backdrop"><section class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2>系统设置</h2><button class="btn" data-close>关闭</button></div>${state.database.restart_required?'<div class="notice">数据库配置等待重启生效。当前活动数据库：'+esc(dbSummary(state.database.active))+'</div>':''}<form id="settings-form"><h3 class="section-title">锐捷路由器</h3><div class="form-grid"><div class="field full"><label>管理地址</label><input class="input" id="s-router-host" value="${esc(cfg.router_host)}" required></div><div class="field"><label>用户名</label><input class="input" id="s-router-user" value="${esc(cfg.router_user)}"></div><div class="field"><label>密码</label><input class="input" id="s-router-pass" type="password" placeholder="${cfg.router_password_configured?'已配置，留空保持':'请输入路由器密码'}"></div><div class="field"><label>采集间隔（秒）</label><input class="input" id="s-poll" type="number" min="3" max="300" value="${cfg.poll_interval}"></div><div class="field" style="align-self:end"><button type="button" class="btn" id="discover-btn">测试登录并发现数据</button></div></div><div id="discover-result"></div><h3 class="section-title">业务数据库 <small style="float:right;font-weight:normal;color:#8ba3c7">当前生效: ${state.database.active.type==='sqlite'?'本地 SQLite':'PostgreSQL'} (${esc(dbSummary(state.database.active))})</small></h3><div class="form-grid"><div class="field"><label>类型</label><select class="input" id="s-db-type"><option value="sqlite">SQLite</option><option value="postgresql">PostgreSQL</option></select></div><div class="field sqlite-field"><label>文件名</label><input class="input" id="s-db-file" value="${esc(db.filename||'monitor.db')}"></div><div class="field pg-field"><label>主机/IP</label><input class="input" id="s-db-host" value="${esc(db.host||'')}"></div><div class="field pg-field"><label>端口</label><input class="input" id="s-db-port" type="number" min="1" max="65535" value="${db.port||5432}"></div><div class="field pg-field"><label>数据库名</label><input class="input" id="s-db-name" value="${esc(db.database||'')}"></div><div class="field pg-field"><label>用户名</label><input class="input" id="s-db-user" value="${esc(db.user||'')}"></div><div class="field pg-field"><label>密码</label><input class="input" id="s-db-pass" type="password" placeholder="${db.password_configured?'已配置，留空保持':'请输入密码'}"></div><div class="field pg-field"><label>SSL模式</label><select class="input" id="s-db-ssl"><option>disable</option><option>prefer</option><option>require</option></select></div><div class="field full"><button type="button" class="btn" id="db-test-btn">测试数据库连接及读写验证</button></div></div><div id="db-test-result"></div><h3 class="section-title">数据留存</h3><div class="form-grid"><div class="field"><label>常规设备留存（天）</label><input class="input" id="s-ret-norm" type="number" min="1" max="3650" value="${cfg.retention_days_normal||30}"></div><div class="field"><label>关注设备留存（天）</label><input class="input" id="s-ret-star" type="number" min="1" max="3650" value="${cfg.retention_days_starred||180}"></div></div><h3 class="section-title">Telegram</h3><div class="form-grid"><div class="field"><label>启用</label><select class="input" id="s-tg-enabled"><option value="false">关闭</option><option value="true">启用</option></select></div><div class="field"><label>Chat ID</label><input class="input" id="s-tg-chat" value="${esc(cfg.telegram_chat_id||'')}"></div><div class="field full"><label>Bot Token</label><input class="input" id="s-tg-token" type="password" placeholder="${cfg.telegram_token_configured?'已配置，留空保持':'请输入Token'}"></div></div><div class="form-actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit" id="btn-save">保存配置</button></div></form><h3 class="section-title">管理员密码</h3><form id="password-form"><div class="form-grid"><div class="field"><label>当前密码</label><input class="input" id="p-current" type="password" required></div><div></div><div class="field"><label>新密码</label><input class="input" id="p-new" type="password" minlength="10" required></div><div class="field"><label>确认新密码</label><input class="input" id="p-confirm" type="password" minlength="10" required></div></div><div class="form-actions"><button class="btn" type="submit">修改管理员密码</button></div></form></section></div>`;overlay.onclick=e=>{if(e.target.closest('[data-close]'))closeOverlay()};const type=document.getElementById('s-db-type');type.value=db.type||'sqlite';document.getElementById('s-db-ssl').value=db.sslmode||'disable';document.getElementById('s-tg-enabled').value=String(cfg.telegram_enabled);function toggle(){document.querySelectorAll('.pg-field').forEach(x=>x.classList.toggle('hidden',type.value!=='postgresql'));document.querySelectorAll('.sqlite-field').forEach(x=>x.classList.toggle('hidden',type.value!=='sqlite'))}type.onchange=toggle;toggle();document.getElementById('discover-btn').onclick=testDiscover;document.getElementById('db-test-btn').onclick=testDb;document.getElementById('settings-form').onsubmit=saveSettings;document.getElementById('password-form').onsubmit=savePassword;state.settingsTested={router:true,db:true};document.querySelectorAll('#s-router-host, #s-router-user, #s-router-pass').forEach(el=>{el.addEventListener('input',()=>{state.settingsTested.router=false;checkSaveBtn()})});document.querySelectorAll('#s-db-type, #s-db-file, #s-db-host, #s-db-port, #s-db-name, #s-db-user, #s-db-pass, #s-db-ssl').forEach(el=>{el.addEventListener('input',()=>{state.settingsTested.db=false;checkSaveBtn()})});checkSaveBtn()}catch(err){toast(err.message,true)}}
function checkSaveBtn(){const btn=document.getElementById('btn-save');if(!btn)return;if(state.settingsTested.router&&state.settingsTested.db){btn.disabled=false;btn.textContent='保存配置'}else{btn.disabled=true;btn.textContent='请先测试连通性'}}
function dbPayload(){const type=document.getElementById('s-db-type').value;return type==='sqlite'?{type,filename:document.getElementById('s-db-file').value}:{type,host:document.getElementById('s-db-host').value,port:Number(document.getElementById('s-db-port').value),database:document.getElementById('s-db-name').value,username:document.getElementById('s-db-user').value,password:document.getElementById('s-db-pass').value||null,sslmode:document.getElementById('s-db-ssl').value}}
async function testDiscover(e){if(e){e.preventDefault();e.stopPropagation()}const el=document.getElementById('discover-result'),btn=document.getElementById('discover-btn');btn.disabled=true;el.className='notice';el.textContent='正在登录并发现user_list/local_topology…';try{const data=await api('/api/router/discover',{method:'POST',body:JSON.stringify({host:document.getElementById('s-router-host').value,username:document.getElementById('s-router-user').value,password:document.getElementById('s-router-pass').value||null})});el.textContent=`认证成功；客户端 ${data.counts.clients}；网络节点 ${data.counts.network_nodes}；接口直采 ${data.capabilities.direct_api?'可用':'等待首次学习'}`;state.settingsTested.router=true;checkSaveBtn()}catch(err){el.className='error';el.textContent=err.message}finally{btn.disabled=false}}
async function testDb(e){if(e){e.preventDefault();e.stopPropagation()}const el=document.getElementById('db-test-result'),btn=document.getElementById('db-test-btn');btn.disabled=true;el.className='notice';el.textContent='正在验证连接、临时表和读写权限…';try{const data=await api('/api/database/test',{method:'POST',body:JSON.stringify(dbPayload())});el.textContent=data.message;state.settingsTested.db=true;checkSaveBtn()}catch(err){el.className='error';el.textContent=err.message}finally{btn.disabled=false}}
async function saveSettings(e){e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const payload={router_host:document.getElementById('s-router-host').value,router_user:document.getElementById('s-router-user').value,router_password:document.getElementById('s-router-pass').value||null,poll_interval:Number(document.getElementById('s-poll').value),telegram_enabled:document.getElementById('s-tg-enabled').value==='true',telegram_token:document.getElementById('s-tg-token').value||null,telegram_chat_id:document.getElementById('s-tg-chat').value,retention_days_normal:Number(document.getElementById('s-ret-norm').value),retention_days_starred:Number(document.getElementById('s-ret-star').value),database:dbPayload()};const data=await api('/api/config',{method:'POST',body:JSON.stringify(payload)});closeOverlay();if(confirm('配置已保存成功！为了确保所有组件和数据库连接完整生效，是否立即重启后台服务？')){performRestart()}else{toast(data.restart_required?'配置已保存；数据库切换需重启服务':'配置已保存');await bootstrap()}}catch(err){toast(err.message,true)}finally{btn.disabled=false}}
async function savePassword(e){e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const data=await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current_password:document.getElementById('p-current').value,new_password:document.getElementById('p-new').value,confirm_password:document.getElementById('p-confirm').value})});state.csrf=data.csrf_token;toast('管理员密码已修改，其他会话已失效');closeOverlay()}catch(err){toast(err.message,true)}finally{btn.disabled=false}}
start();
</script>
</body>
</html>
